<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModelViewer3D</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #canvas-container { 
            width: 100%; height: 100%; 
            position: absolute; top: 0; left: 0; 
            z-index: 0; 
            display: block;
        }
        #app {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; /* Let clicks pass through to canvas when not on UI */
        }
        /* Re-enable pointer events for UI elements */
        .ui-overlay { pointer-events: none; width: 100%; height: 100%; }
        .interactive { pointer-events: auto; }
        .menu-btn, .hud { pointer-events: auto; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="app">Loading...</div>

    <script src="_framework/blazor.webview.js"></script>

    <!-- ES Module Shims for better Import Map support -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/game.js"></script>
</body>
</html>
